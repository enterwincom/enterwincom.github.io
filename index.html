<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>자기개발자 | Personal Page</title>
    <meta name="description" content="자기개발자 바로가기 페이지">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;

            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 전체 영역 */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* 상단 네비게이션 */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 28px 0;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .nav-text {
            color: #94a3b8;
            font-size: 14px;
        }

        /* 메인 */
        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 배경 장식 */
        .background-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.12);
            filter: blur(80px);
            top: -180px;
            right: -150px;
        }

        .background-circle2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.10);
            filter: blur(80px);
            bottom: -180px;
            left: -150px;
        }

        .hero {
            position: relative;
            z-index: 1;
            padding: 120px 0 80px;
        }

        .eyebrow {
            display: inline-block;
            color: #60a5fa;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1.05;
            letter-spacing: -3px;
            margin-bottom: 28px;
        }

        h1 span {
            color: #60a5fa;
        }

        .intro {
            max-width: 650px;
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 55px;
        }

        /* 바로가기 */
        .links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            max-width: 850px;
        }

        .link-card {
            position: relative;
            padding: 26px;
            min-height: 150px;

            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 20px;

            backdrop-filter: blur(12px);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }

        .link-card:hover {
            transform: translateY(-7px);
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(96, 165, 250, 0.5);
        }

        .link-number {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .link-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .link-description {
            color: #94a3b8;
            font-size: 14px;
        }

        .arrow {
            position: absolute;
            right: 24px;
            bottom: 24px;

            font-size: 20px;
            color: #60a5fa;

            transition: transform 0.25s ease;
        }

        .link-card:hover .arrow {
            transform: translate(4px, -4px);
        }

        /* 하단 */
        footer {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        /* 모바일 */
        @media (max-width: 700px) {

            header {
                padding: 22px 0;
            }

            .container {
                padding: 0 20px;
            }

            .hero {
                padding: 100px 0 100px;
            }

            h1 {
                letter-spacing: -2px;
                margin-bottom: 22px;
            }

            .intro {
                font-size: 16px;
                line-height: 1.7;
                margin-bottom: 40px;
            }

            .links {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .link-card {
                min-height: 120px;
                padding: 22px;
            }

            .link-number {
                margin-bottom: 15px;
            }

            footer {
                position: relative;
                bottom: auto;
                padding-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <main>

                </p>


                <div class="links">

                    <!-- 바로가기 1 -->
                    <a href="https://blog.naver.com/enterwincom" class="link-card">

                    <a href="https://github.com/enterwincom" class="link-card">
                        <div class="link-number">02</div>

                        <div class="link-title">
                            프로젝트
                        </div>

                        <div class="link-description">
                            직접 만들고 있는 웹 프로젝트입니다.
                        </div>

                        <div class="arrow">
                            ↗
                        </div>
                    </a>


                    <!-- 바로가기 3 -->
                    <a href="https://github.com/enterwincom" class="link-card">
                        <div class="link-number">03</div>

                        <div class="link-title">
                            GitHub
                        </div>

                        <div class="link-description">

                        </div>

                        <div class="arrow">
                            ↗
                        </div>
                    </a>

                </div>

            </section>
        </div>

    </main>


    <footer>
        © 2026 ENTERWINCOM. All rights reserved.
    </footer>

</body>
</html>
