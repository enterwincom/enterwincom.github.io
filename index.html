<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dev Blog</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="app">

  <!-- TOP BAR (VS Code 느낌) -->
  <header class="topbar">
    <div class="brand">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">dev-blog</span>
    </div>

    <div class="actions">
      <button onclick="toggleTheme()">🌙 / ☀️</button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="layout">

    <!-- SIDEBAR (Explorer 느낌) -->
    <aside class="sidebar">
      <div class="sidebar-title">📁 POSTS</div>
      <ul id="postList" class="file-tree"></ul>
    </aside>

    <!-- CONTENT (Editor 느낌) -->
    <section id="content" class="editor">

      <div class="editor-header">
        <span class="file-name">welcome.md</span>
      </div>

      <div class="editor-body">
        <h1>Welcome 👋</h1>
        <p>왼쪽에서 글을 선택하면 내용이 표시됩니다.</p>
        <pre>
# Dev Blog
- Markdown 기반 블로그
- 개발자 스타일 UI
- VS Code 느낌 디자인
        </pre>
      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
